<svg viewBox="0 0 960 300" width="100%" style="height:auto" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="cm_ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#FF8904" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="cm_grey" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="rgba(254,254,254,0.5)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<!-- SENDER -->
<rect x="8" y="180" width="158" height="70" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(254,254,254,0.25)" stroke-width="1.2"/>
<text x="87" y="213" text-anchor="middle" font-family="'Anton',sans-serif" font-size="18" fill="#fefefe">SENDER</text>
<text x="87" y="236" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="15" fill="rgba(254,254,254,0.5)">holds the token</text>

<!-- sends -->
<line x1="166" y1="215" x2="300" y2="215" stroke="#FF8904" stroke-width="1.6" marker-end="url(#cm_ar)"/>
<text x="233" y="205" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="15" fill="rgba(254,254,254,0.5)">sends</text>

<!-- TOKEN -->
<rect x="308" y="172" width="200" height="92" rx="14" fill="rgba(255,137,4,0.05)" stroke="#FF8904" stroke-width="1.7"/>
<text x="408" y="216" text-anchor="middle" font-family="'Anton',sans-serif" font-size="24" fill="#fefefe">TOKEN</text>
<text x="408" y="240" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="15" fill="rgba(254,254,254,0.5)">bearer asset</text>

<!-- RECEIVE PREDICATE -->
<rect x="440" y="24" width="220" height="98" rx="10" fill="rgba(255,137,4,0.12)" stroke="#FF8904" stroke-width="1.5"/>
<text x="550" y="56" text-anchor="middle" font-family="'Anton',sans-serif" font-size="16" fill="#FF8904">RECEIVE PREDICATE</text>
<text x="550" y="82" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="15" fill="#fefefe">KYC · JURISDICTION</text>
<text x="550" y="104" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="15" fill="#fefefe">ACCREDITATION</text>
<!-- predicate gates the token (left-side connector, clear of labels) -->
<line x1="478" y1="122" x2="452" y2="172" stroke="#FF8904" stroke-width="1.4"/>
<circle cx="452" cy="172" r="2.6" fill="#FF8904"/>

<!-- VERIFIED HOLDER -->
<rect x="726" y="126" width="226" height="70" rx="10" fill="rgba(255,137,4,0.1)" stroke="#FF8904" stroke-width="1.4"/>
<text x="839" y="158" text-anchor="middle" font-family="'Anton',sans-serif" font-size="18" fill="#FF8904">VERIFIED HOLDER</text>
<text x="839" y="182" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="15" fill="#fefefe">✓ token received</text>
<!-- success path -->
<line x1="515" y1="200" x2="720" y2="162" stroke="#FF8904" stroke-width="1.6" marker-end="url(#cm_ar)"/>
<text x="618" y="150" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="15" fill="#FF8904">satisfies predicate ✓</text>

<!-- UNVERIFIED -->
<rect x="726" y="212" width="226" height="70" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(254,254,254,0.25)" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="839" y="244" text-anchor="middle" font-family="'Anton',sans-serif" font-size="18" fill="rgba(254,254,254,0.6)">UNVERIFIED</text>
<text x="839" y="268" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="15" fill="rgba(254,254,254,0.5)">✗ transfer rejected</text>
<!-- fail path -->
<line x1="515" y1="238" x2="720" y2="252" stroke="rgba(254,254,254,0.5)" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#cm_grey)"/>
<text x="618" y="224" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="15" fill="rgba(254,254,254,0.5)">fails predicate ✗</text>
</svg>