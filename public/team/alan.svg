<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#1a1a1a"/>
  <!-- Ears -->
  <ellipse cx="42" cy="20" rx="5.5" ry="16" fill="#FF6A1F"/>
  <ellipse cx="58" cy="20" rx="5.5" ry="16" fill="#FF6A1F"/>
  <!-- Inner ears -->
  <ellipse cx="42" cy="22" rx="2" ry="10" fill="#FFB084"/>
  <ellipse cx="58" cy="22" rx="2" ry="10" fill="#FFB084"/>
  <!-- Head -->
  <circle cx="50" cy="48" r="19" fill="#FF6A1F"/>
  <!-- Eyes -->
  <circle cx="43" cy="46" r="2.4" fill="#060606"/>
  <circle cx="57" cy="46" r="2.4" fill="#060606"/>
  <circle cx="43.7" cy="45.3" r="0.7" fill="#FEFEFE"/>
  <circle cx="57.7" cy="45.3" r="0.7" fill="#FEFEFE"/>
  <!-- Nose -->
  <ellipse cx="50" cy="54" rx="2" ry="1.4" fill="#060606"/>
  <!-- Mouth -->
  <path d="M50 56 Q47 60 45 58" fill="none" stroke="#060606" stroke-width="0.9" stroke-linecap="round"/>
  <path d="M50 56 Q53 60 55 58" fill="none" stroke="#060606" stroke-width="0.9" stroke-linecap="round"/>
  <!-- Whiskers -->
  <line x1="38" y1="52" x2="28" y2="50" stroke="#FFB084" stroke-width="0.7" stroke-linecap="round"/>
  <line x1="38" y1="54" x2="28" y2="56" stroke="#FFB084" stroke-width="0.7" stroke-linecap="round"/>
  <line x1="62" y1="52" x2="72" y2="50" stroke="#FFB084" stroke-width="0.7" stroke-linecap="round"/>
  <line x1="62" y1="54" x2="72" y2="56" stroke="#FFB084" stroke-width="0.7" stroke-linecap="round"/>
  <!-- Body -->
  <ellipse cx="50" cy="84" rx="22" ry="12" fill="#FF6A1F"/>
  <!-- Front paws -->
  <ellipse cx="42" cy="92" rx="4" ry="3" fill="#E55F1B"/>
  <ellipse cx="58" cy="92" rx="4" ry="3" fill="#E55F1B"/>
</svg>
